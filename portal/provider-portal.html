<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nume Health · Provider Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --blue:#0077B6; --blue-dark:#005f92; --navy:#101D31; --teal:#0fa898;
  --gold:#12C8B8; --mint:#D8F7F2; --off:#F7FAFC; --bd:#E2E8F0;
  --slate:#2E3E50; --gray:#7A8794; --white:#fff;
  --red:#c0392b; --red-bg:#fdecea; --amber:#8a6d00; --amber-bg:#fff4d6; --green:#1c7a42; --green-bg:#dff3e6;
  --shadow:0 1px 2px rgba(16,29,49,.06),0 4px 16px rgba(16,29,49,.07);
  --mono:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--slate);background:var(--off);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* topbar */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .mk{background:var(--gold);color:var(--navy);width:27px;height:27px;border-radius:7px;display:grid;place-items:center;font-weight:800}
.brand small{font-weight:500;opacity:.65;font-size:11.5px}
.spacer{flex:1}
.rolepick{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rolepick select{font-family:inherit;font-size:12.5px;padding:6px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
.rolepick select option{color:#111}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.who b{font-size:12.5px}.who small{font-size:10.5px;opacity:.6}
.lensbtn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 11px;border-radius:8px;font-size:12px}
.lensbtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}

/* body */
.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.rail{background:#fff;border-right:1px solid var(--bd);padding:14px 12px;overflow:auto}
.rail h4{margin:12px 8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray)}
.navbtn{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:9px 11px;display:flex;gap:10px;align-items:center;color:var(--slate);margin-bottom:2px;font-size:13.5px}
.navbtn:hover{background:var(--off)}
.navbtn.on{background:var(--mint);border-color:var(--blue);font-weight:600}
.navbtn .ic{width:20px;text-align:center}
.navbtn .ct{margin-left:auto;font-size:11px;background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-weight:700}
.navbtn .ct.warn{background:var(--red)}
.scopecard{margin:14px 8px 4px;font-size:11.5px;color:var(--gray);background:var(--off);border:1px dashed var(--bd);border-radius:8px;padding:9px 10px}
.scopecard b{color:var(--blue-dark)}
.main{overflow:auto;padding:20px 26px}

/* page head */
.crumbs{display:flex;gap:7px;align-items:center;color:var(--gray);font-size:12.5px;margin-bottom:12px}
.crumbs a{color:var(--blue);cursor:pointer}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:22px;margin:0;color:var(--navy)}
.pagehead .sub{color:var(--gray);font-size:13px;margin-top:3px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate);background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}

/* cards / queue */
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;color:var(--navy);display:flex;align-items:center;gap:9px}
.card>.hd .r{margin-left:auto;font-weight:500;font-size:12px;color:var(--gray)}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.qitem:last-child{border-bottom:none}
.qitem:hover{background:var(--off)}
.qitem .av{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--blue-dark);display:grid;place-items:center;font-weight:700;font-size:13px}
.qitem .nm{font-weight:600;color:var(--navy)}
.qitem .meta{font-size:12px;color:var(--gray);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qitem .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.qitem .age{font-size:11.5px;color:var(--gray)}

.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.tag.consult{background:#e7f0ff;color:#2451b3}
.tag.followup{background:var(--mint);color:var(--blue-dark)}
.tag.refill{background:#efe7ff;color:#59359a}
.tag.side{background:var(--amber-bg);color:var(--amber)}
.tag.lab{background:#e0f7fa;color:#00707d}
.tag.msg{background:#eee;color:#555}
.flagpill{font-size:10.5px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid #f5c2c8;border-radius:999px;padding:2px 8px}
.pri{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.pri.high{background:var(--red-bg);color:var(--red)} .pri.med{background:var(--amber-bg);color:var(--amber)} .pri.low{background:var(--off);color:var(--gray)}

/* chart */
.chart-hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.chart-hd .big{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.chart-hd h2{margin:0;font-size:19px;color:var(--navy)}
.chart-hd .demo{color:var(--gray);font-size:12.5px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.chart-hd .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.sec{margin:0}
.sec .hd{padding:11px 15px;border-bottom:1px solid var(--bd);font-weight:700;color:var(--navy);font-size:13.5px;display:flex;gap:8px;align-items:center}
.sec .bd{padding:6px 15px 13px}
.li{padding:7px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.li:last-child{border-bottom:none}
.li .s{font-size:11.5px;color:var(--gray)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;padding:5px 0}
.kv .k{color:var(--gray);font-size:12px}

/* flags banner */
.flags{background:var(--red-bg);border:1px solid #f5c2c8;border-left:4px solid var(--red);border-radius:10px;padding:12px 15px;margin-bottom:16px}
.flags b{color:var(--red)}
.flags ul{margin:7px 0 0;padding-left:18px}
.flags li{margin:3px 0;font-size:13px}
.flags.clear{background:var(--green-bg);border-color:#b6e3c7;border-left-color:var(--green)}
.flags.clear b{color:var(--green)}

/* permission masks */
.mask{color:var(--gray);font-family:var(--mono);font-size:12.5px}
.obsc{color:var(--gray);font-style:italic;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.lens .partial{outline:2px dashed var(--gold);outline-offset:1px;border-radius:4px}
.lens .obscured{outline:2px dashed var(--red);outline-offset:1px;border-radius:4px}
.vbadge{display:none}
.lens .vbadge{display:inline-block;font-size:9px;font-family:var(--mono);padding:0 4px;border-radius:4px;margin-left:5px;vertical-align:middle}
.lens .vbadge.p{background:var(--amber-bg);color:var(--amber)}
.lens .vbadge.o{background:var(--red-bg);color:var(--red)}

/* buttons */
.btn{border:1px solid var(--bd);background:#fff;color:var(--slate);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{background:var(--off)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:#f5c2c8;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}

/* encounter */
.enc{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.enc .tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);background:var(--off);padding:0 8px;flex-wrap:wrap}
.enc .tab{background:none;border:none;border-bottom:3px solid transparent;padding:11px 14px;font-size:13px;font-weight:600;color:var(--gray)}
.enc .tab.on{color:var(--blue-dark);border-bottom-color:var(--blue)}
.enc .pane{padding:16px 18px;display:none}
.enc .pane.on{display:block}
.q{margin:0 0 12px}
.q .ql{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.q .qa{font-size:14.5px;color:var(--navy);margin-top:2px}
.q .qa.flag{color:var(--red);font-weight:600}
.protocol{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.protocol:hover{background:var(--off)}
.protocol.sel{border-color:var(--blue);background:var(--mint)}
.protocol .t{font-weight:700;color:var(--navy)}
.protocol .steps{font-size:12.5px;color:var(--gray);margin-top:4px}
textarea{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--bd);border-radius:9px;padding:10px;resize:vertical;min-height:70px}
.decisionbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--bd);background:var(--off)}
.autonomy{font-size:12px;color:var(--gray);margin-left:auto;align-self:center;max-width:320px}

/* history timeline */
.tl{position:relative;margin:4px 0 0 6px;padding-left:18px;border-left:2px solid var(--bd)}
.tl .ev{position:relative;padding:0 0 16px 8px}
.tl .ev:before{content:'';position:absolute;left:-25px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.tl .ev .d{font-size:11.5px;color:var(--gray)}
.tl .ev .t{font-weight:600;color:var(--navy);font-size:13.5px}

.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;max-width:340px;z-index:50;font-size:13px}
.toast.on{opacity:1;transform:none}
.empty{color:var(--gray);text-align:center;padding:40px 20px}
.small{font-size:12px;color:var(--gray)}
.note-inline{background:var(--off);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--slate);margin-top:6px}
.note-inline b{color:var(--blue-dark)}
</style>
</head>

</div>

/* ---- Red-flag engine (Kara: bold red flags) -------------------------------- */
function redFlags(p){
  const f=[];
  (p.allergies||[]).forEach(a=>{ if(a.sev==='Severe') f.push('Severe allergy on file: '+a.sub+' ('+a.reaction+')'); });
  (p.intake?.answers||[]).forEach(a=>{ if(a.flag) f.push('Intake flag — '+a.q+': '+a.a); });
  // GLP-1 contraindication scan
  const hay=JSON.stringify(p.intake?.answers||[]).toLowerCase();
  if(hay.includes('medullary')||hay.includes('men2')) f.push('GLP-1 CONTRAINDICATION: personal/family hx of MTC / MEN2');
  if(hay.includes('pancreatitis')&&hay.includes('yes')) f.push('Caution: history of pancreatitis');
  // chart vs intake allergy inconsistency
  const chartAll=(p.allergies||[]).map(a=>a.sub.toLowerCase());
  const intakeAll=(p.intake?.answers||[]).filter(a=>/allerg/i.test(a.q)).map(a=>a.a.toLowerCase()).join(' ');
  chartAll.forEach(s=>{ if(intakeAll && !intakeAll.includes(s.split(' ')[0])) f.push('Chart/intake mismatch: chart lists “'+s+'”, not confirmed on intake'); });
  // BP
  const bp=(p.vitals?.bp||'').split('/'); if(+bp[0]>=140||+bp[1]>=90) f.push('Elevated BP on intake: '+p.vitals.bp);
  return f;
}

/* ---- Permission helpers ---------------------------------------------------- */
function vis(cls){ return ROLES[state.role].vis[cls] || 'full'; }
function inScope(p){
  const r=ROLES[state.role];
  if(r.scope==='pharmacy') return p.pharmacyId===PHARMACY_ID;
  // direct-care: only patients whose care team includes me
  return (p.careTeam||[]).includes(ME.provider);
}
/* render a value honoring the field's visibility level for the current role */
function field(cls, value, opts={}){
  const level=vis(cls);
  if(level==='full') return '<span>'+esc(value)+'</span>';
  if(level==='partial'){
    let masked = opts.mask!==undefined ? opts.mask : partialMask(cls, value);
    return '<span class="partial mask">'+esc(masked)+'<span class="vbadge p">PARTIAL</span></span>';
  }
  return '<span class="obscured obscured">🔒 restricted<span class="vbadge o">OBSCURED</span></span>';
}
function partialMask(cls,value){
  value=String(value==null?'':value);
  if(cls==='ssn') return '•••-••-'+value.slice(-4);
  if(cls==='demographic') return value.split(' ')[0]+' ' + (value.split(' ').slice(1).map(w=>w[0]?w[0]+'.':'').join(''));
  if(cls==='financial') return '$ ••••';
  if(cls==='note') return value.slice(0,40)+'… (full note restricted)';
  return '••••';
}
function canSeeClinical(){ return vis('clinical')==='full'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---- Comprehensive encounter (Kara: initial=full intake, follow-up=chief-first) */
function renderEncounter(p){
  const it=p.intake||{answers:[]};
  const isInitial = it.type==='initial';
  const tabs=[['summary', isInitial?'Full intake':'Check-in'],['assess','Assessment & plan'],['rx','Prescribe']];
  const tabBar='<div class="tabs">'+tabs.map(t=>'<button class="tab '+(state.encTab===t[0]?'on':'')+'" onclick="encTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';

  // summary/intake pane
  let chief='<div class="q"><div class="ql">Chief complaint</div><div class="qa">'+esc(it.chief||'—')+'</div></div>';
  let intakePane;
  if(isInitial){
    intakePane = chief + it.answers.map(a=>'<div class="q"><div class="ql">'+esc(a.q)+'</div><div class="qa '+(a.flag?'flag':'')+'">'+(a.flag?'⚑ ':'')+esc(a.a)+'</div></div>').join('');
  } else {
    // follow-up / side-effect / refill: chief complaint + updated info first
    intakePane = chief +
      '<div class="note-inline">Follow-up view — showing chief complaint + what changed since last visit first (full intake available via history).</div>'+
      it.answers.map(a=>'<div class="q"><div class="ql">'+esc(a.q)+'</div><div class="qa '+(a.flag?'flag':'')+'">'+(a.flag?'⚑ ':'')+esc(a.a)+'</div></div>').join('')+
      '<div style="margin-top:8px"><button class="btn sm" onclick="toast(\'Would open the full prior intake from the patient history.\')">View full prior intake →</button></div>';
  }

  // assessment
  const flags=redFlags(p);
  const assessPane =
    '<div class="q"><div class="ql">Impression</div><div class="qa">'+esc((p.conditions[0]?p.conditions[0].name:'Weight management'))+' — candidate for GLP-1 therapy</div></div>'+
    (flags.length?'<div class="flags"><b>Consider before prescribing</b><ul>'+flags.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>':'<div class="flags clear"><b>No contraindication flags.</b></div>')+
    '<div class="q"><div class="ql">Assessment note</div><textarea id="assessNote" placeholder="Clinical assessment...">'+esc(assessDefault(p))+'</textarea></div>';

  // prescribe pane — suggested drug + 3 titration options + one-click
  const suggest = /tirzepatide/i.test((p.rx[0]||{}).drug||'') || /tirzepatide/i.test(it.chief||'') ? 'tirzepatide' : 'semaglutide';
  const protos = PROTOCOLS[suggest];
  const rxPane =
    '<div class="q"><div class="ql">Suggested therapy</div><div class="qa">'+cap(suggest)+' (compounded, 503A) — Nume formulary</div></div>'+
    '<div class="small" style="margin-bottom:8px">Pre-queued titration options — select one, then approve. You may also decline without pressure.</div>'+
    protos.map(pr=>'<div class="protocol '+(state.selProtocol===pr.id?'sel':'')+'" onclick="pickProtocol(\''+pr.id+'\')"><div class="t">'+esc(pr.t)+'</div><div class="steps">'+esc(pr.steps)+'</div></div>').join('')+
    '<div class="q"><div class="ql">Directions / note to pharmacy</div><textarea id="rxNote" placeholder="Sig, counseling, special instructions...">Inject SC once weekly. Rotate injection sites. Counsel on GI side effects and red-flag symptoms.</textarea></div>';

  const panes =
    '<div class="pane '+(state.encTab==='summary'?'on':'')+'">'+intakePane+'</div>'+
    '<div class="pane '+(state.encTab==='assess'?'on':'')+'">'+assessPane+'</div>'+
    '<div class="pane '+(state.encTab==='rx'?'on':'')+'">'+rxPane+'</div>';

  const decision =
    '<div class="decisionbar">'+
      '<button class="btn ok" onclick="decide(\'approve\')">✓ Approve & send to pharmacy</button>'+
      '<button class="btn" onclick="decide(\'labs\')">🧪 Request labs / records first</button>'+
      '<button class="btn" onclick="decide(\'message\')">✉️ Message patient</button>'+
      '<button class="btn danger" onclick="decide(\'decline\')">Decline / not clinically appropriate</button>'+
      '<div class="autonomy">Provider autonomy: declining or deferring carries no penalty. Labs routing sends a request instead of auto-disqualifying.</div>'+
    '</div>';

  return '<div class="enc"><div class="hd" style="padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;color:var(--navy)">📝 '+(isInitial?'Initial encounter':'Follow-up encounter')+' — '+esc(p.first+' '+p.last)+'</div>'+tabBar+panes+decision+'</div>';
}

        '<div class="note-inline">Kara: schedule edits should lock until booked appointments lapse; comp fair on side-effect-heavy mixes.</div>')+
      sec('🎫 Credentials & compliance', '<div class="kv"><span class="k">NPI</span><span>1&bull;&bull;&bull;&bull;&bull;7890</span>'+
        '<span class="k">DEA</span><span>on file · verified</span>'+
        '<span class="k">Malpractice / E&amp;O</span><span>Verified · exp 2027-03</span>'+
        '<span class="k">OIG/OCR exclusion check</span><span>Clear</span></div>')+
      sec('🔁 Continuity', '<div class="li">Patients may choose <b>same-provider</b> or <b>first-available</b>. Your follow-ups are routed to you first, then released to the queue.</div>')+
      sec('💵 Compensation (preview)', '<div class="li">Per-script base with a fair floor on side-effect-heavy visit mixes (the Hims weight-loss gap). Volume incentives above threshold.</div>')+
    '</div>';
}

/* ---- misc UI --------------------------------------------------------------- */
function crumbs(parts){ return '<div class="crumbs">'+parts.map((p,i)=>(p[1]?'<a onclick="go(\''+p[1]+'\')">'+esc(p[0])+'</a>':'<span>'+esc(p[0])+'</span>')+(i<parts.length-1?' <span>›</span>':'')).join('')+'</div>'; }
function go(v){ state.view=v; if(v!=='chart') state.patientId=null; render(); }
function toggleAll(v){ state.showAll=v; render(); }
function toggleEnc(){ state.encExpanded=!state.encExpanded; render(); }
function encTab(t){ state.encTab=t; render(); }
function pickProtocol(id){ state.selProtocol=id; render(); }
function decide(kind){
  const p=patient(state.patientId);
  if(kind==='approve'){ if(!state.selProtocol && state.encTab!=='rx'){ toast('Open the Prescribe tab and choose a titration plan first.'); encTab('rx'); return; }
    if(!state.selProtocol){ toast('Select a titration plan to approve.'); return; }
    toast('✓ Approved — Rx sent to pharmacy for '+p.first+' '+p.last+'. Queue item closed.'); state.encExpanded=false; setTimeout(()=>go('queue'),700); return; }
  if(kind==='labs'){ toast('🧪 Labs/records requested — patient moved to “awaiting labs”, not disqualified.'); return; }
  if(kind==='message'){ toast('✉️ Secure message drafted to '+p.first+'.'); return; }
  if(kind==='decline'){ toast('Declined — documented as not clinically appropriate. No penalty; patient notified with guidance.'); state.encExpanded=false; setTimeout(()=>go('queue'),700); return; }
}

/* ---- boot ------------------------------------------------------------------ */
function boot(){
  const sel=document.getElementById('roleSel');
  sel.innerHTML=Object.keys(ROLES).map(k=>'<option value="'+k+'">'+ROLES[k].label+'</option>').join('');
  sel.value=state.role;
  sel.onchange=e=>{ state.role=e.target.value; state.view='queue'; state.patientId=null; render(); };
  document.getElementById('lensBtn').onclick=()=>{ state.lens=!state.lens; render(); };
  render();
}
boot();
</script>
</body>
