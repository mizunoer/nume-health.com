<meta charset="utf-8">
<title>Nume Health · Care Portal — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  /* Numi brand palette (--nume-* values mapped onto the layout tokens) */
  --mrx-blue:#0077B6; --mrx-primary-dark:#005f92; --mrx-navy:#101D31;
  --mrx-teal:#0fa898; --mrx-cyan:#00A6C8; --mrx-accent-dark:#0B1B2B;
  --mrx-gold:#12C8B8; --mrx-mint:#D8F7F2; --mrx-offwhite:#F7FAFC;
  --mrx-border:#E2E8F0; --mrx-slate:#2E3E50; --mrx-slate-gray:#7A8794; --mrx-white:#fff;
  --shadow:0 1px 2px rgba(16,29,49,.06),0 4px 16px rgba(16,29,49,.06);
  --mono:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--mrx-slate);background:var(--mrx-offwhite);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
code,.mono{font-family:var(--mono)}

/* ---- shell ---- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--mrx-navy);color:var(--mrx-white);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brand .rx{background:var(--mrx-gold);color:var(--mrx-accent-dark);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800}
.brand small{font-weight:500;opacity:.7;letter-spacing:.3px}
.appswitch{display:flex;gap:6px;margin-left:6px}
.appswitch button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:7px;align-items:center}
.appswitch button.on{background:var(--mrx-gold);color:var(--mrx-accent-dark);border-color:var(--mrx-gold);font-weight:700}
.appswitch button.soon{opacity:.55;cursor:not-allowed}
.topbar .spacer{flex:1}
.toolbtn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:8px;font-size:12.5px}
.toolbtn.on{background:var(--mrx-blue);border-color:var(--mrx-blue)}

.body{display:grid;grid-template-columns:238px 1fr;min-height:0}
.body.insp{grid-template-columns:238px 1fr 360px}
.body.wf{grid-template-columns:238px 1fr}

/* ---- rail ---- */
.rail{background:var(--mrx-white);border-right:1px solid var(--mrx-border);padding:14px 12px;overflow:auto}
.rail h4{margin:14px 8px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mrx-slate-gray)}
.rolebtn,.navbtn{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:9px 11px;display:flex;gap:10px;align-items:center;color:var(--mrx-slate);margin-bottom:2px}
.rolebtn small{display:block;color:var(--mrx-slate-gray);font-size:11px}
.rolebtn:hover,.navbtn:hover{background:var(--mrx-offwhite)}
.rolebtn.on{background:var(--mrx-mint);border-color:var(--mrx-blue)}
.navbtn.on{background:var(--mrx-mint);border-color:var(--mrx-blue);font-weight:600}
.navbtn .ic{width:20px;text-align:center}
.pgnote{margin:10px 8px 2px;font-size:11px;color:var(--mrx-slate-gray);background:var(--mrx-offwhite);border:1px dashed var(--mrx-border);border-radius:8px;padding:8px 9px}
.pgnote b{color:var(--mrx-primary-dark)}

/* ---- main ---- */
.main{overflow:auto;padding:20px 26px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--mrx-slate-gray);font-size:12.5px;margin-bottom:12px}
.crumbs a{color:var(--mrx-blue);cursor:pointer;text-decoration:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{font-size:21px;margin:0;color:var(--mrx-navy)}
.pagehead .sub{color:var(--mrx-slate-gray);font-size:13px;margin-top:3px}
.lawful{font-size:11.5px;background:var(--mrx-white);border:1px solid var(--mrx-border);border-left:3px solid var(--mrx-blue);border-radius:7px;padding:7px 11px;color:var(--mrx-slate)}
.lawful b{color:var(--mrx-primary-dark)}

.card{background:var(--mrx-white);border:1px solid var(--mrx-border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--mrx-offwhite);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mrx-slate-gray);padding:10px 14px;border-bottom:1px solid var(--mrx-border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--mrx-border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowlink:hover td{background:var(--mrx-offwhite);cursor:pointer}
.k{font-family:var(--mono);font-size:12px;color:var(--mrx-cyan)}

.detail{display:grid;grid-template-columns:1fr;gap:16px}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 0}
.field{padding:10px 14px;border-bottom:1px solid var(--mrx-border)}
.field .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mrx-slate-gray);display:flex;gap:7px;align-items:center;margin-bottom:3px}
.field .val{font-size:14.5px;color:var(--mrx-slate)}
.field .val.mono{font-family:var(--mono);font-size:12.5px}
.sectitle{font-size:13px;font-weight:700;color:var(--mrx-navy);padding:12px 14px 0;display:flex;gap:8px;align-items:center}

.badge{font-size:9.5px;font-family:var(--mono);padding:2px 6px;border-radius:5px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.dt{background:#eef4ef;color:var(--mrx-cyan);border:1px solid var(--mrx-mint)}
.masked{background:#fff4d6;color:#8a6d00;border:1px solid var(--mrx-gold)}
.phi{background:#fde8ea;color:#a12633;border:1px solid #f5c2c8}
.tok{background:#e7f0ff;color:#2451b3;border:1px solid #c7dbff}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block}
.pill.status{background:var(--mrx-mint);color:var(--mrx-primary-dark)}
.pill.txn{background:#fff4d6;color:#8a6d00}
.pill.ok{background:#dff3e6;color:#1c7a42}

.maskvalue{color:var(--mrx-slate-gray);font-family:var(--mono);font-size:12.5px}
.locked{color:var(--mrx-slate-gray);font-style:italic;font-size:12.5px}

.notice{background:var(--mrx-white);border:1px solid var(--mrx-border);border-left:3px solid var(--mrx-gold);border-radius:9px;padding:14px 16px;color:var(--mrx-slate);margin-top:4px}
.notice b{color:var(--mrx-primary-dark)}
.src{font-family:var(--mono);font-size:11px;color:var(--mrx-slate-gray)}

/* ---- inspector ---- */
.inspector{background:var(--mrx-accent-dark);color:#cfe9f7;overflow:auto;padding:16px 16px 40px;border-left:1px solid #12283f}
.inspector h3{color:var(--mrx-gold);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:2px 0 4px}
.inspector .lead{color:#9fc3a9;font-size:12px;margin:0 0 14px}
.obj{background:#0a2a18;border:1px solid #14442a;border-radius:9px;padding:11px 12px;margin-bottom:11px}
.obj .rpc{font-family:var(--mono);font-size:10.5px;color:var(--mrx-gold);margin-bottom:7px}
.obj .row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;padding:2px 0;border-bottom:1px dotted #14442a}
.obj .row:last-child{border-bottom:none}
.obj .row .kk{color:#8fd0a3}.obj .row .vv{color:#e7f5ea;text-align:right}
.attrline{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;padding:4px 0;border-bottom:1px dotted #14442a}
.attrline:last-child{border-bottom:none}
.attrline .an{color:#e7f5ea}
.attrline .as{grid-column:1/-1;color:#6f9e7d;font-size:10px}
.vis-y{color:#8fd0a3}.vis-m{color:var(--mrx-gold)}.vis-n{color:#c77}

/* ---- workflow ---- */
.wfwrap{padding:20px 26px;overflow:auto}
.graph{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:14px 0 22px}
.node{background:var(--mrx-white);border:1px solid var(--mrx-border);border-radius:11px;padding:11px 13px;min-width:150px;box-shadow:var(--shadow)}
.node .nt{font-family:var(--mono);font-size:10px;color:var(--mrx-cyan);letter-spacing:.4px}
.node .nn{font-weight:700;color:var(--mrx-navy);font-size:13px;margin:3px 0}
.node small{color:var(--mrx-slate-gray);font-size:11px}
.arrow{align-self:center;color:var(--mrx-blue);font-size:20px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--mrx-border)}
.step .who{font-weight:700;color:var(--mrx-navy)}
.step .who small{display:block;font-weight:500;color:var(--mrx-slate-gray);font-size:11px}
.step .exec{font-family:var(--mono);font-size:11px;margin-top:6px}
.step .msg{background:var(--mrx-offwhite);border:1px solid var(--mrx-border);border-radius:9px;padding:10px 12px;margin-top:8px}
.step .msg .ch{font-family:var(--mono);font-size:10.5px;color:var(--mrx-cyan);margin-bottom:3px}
.mut{font-family:var(--mono);font-size:11.5px;color:var(--mrx-slate)}
.mut b{color:var(--mrx-primary-dark)}
.st-COMPLETED{color:#1c7a42}.st-RUNNING{color:#8a6d00}.st-PENDING{color:var(--mrx-slate-gray)}

.tag{font-size:10px;font-family:var(--mono);background:var(--mrx-offwhite);border:1px solid var(--mrx-border);border-radius:5px;padding:1px 6px;color:var(--mrx-slate-gray)}
.hipaa td,.hipaa th{font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

/* ---- dev-detail toggle: hide integration/dev chrome unless enabled ---- */
body:not(.showdev) .tag, body:not(.showdev) .badge.dt, body:not(.showdev) .src,
body:not(.showdev) .pgnote, body:not(.showdev) .devbit, body:not(.showdev) #btnInsp {display:none}
.devtoggle{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.devtoggle input{accent-color:var(--mrx-gold);width:14px;height:14px}

/* ---- start call ---- */
.callbar{display:flex;justify-content:flex-end;margin:0 0 14px}
.btn-call{background:var(--mrx-blue);color:#fff;border:none;border-radius:999px;padding:11px 24px;font-weight:700;font-size:13.5px;display:flex;gap:9px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.btn-call:hover{background:var(--mrx-primary-dark)}

/* ---- provider preferences ---- */
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--mrx-border);font-size:13.5px}
.prefrow:last-child{border-bottom:none}
.prefrow .pl{color:var(--mrx-slate)}
.prefrow .pl small{display:block;color:var(--mrx-slate-gray);font-size:11.5px}
.prefrow .pv{font-weight:600;color:var(--mrx-navy);text-align:right}
.tog{width:36px;height:20px;border-radius:999px;background:var(--mrx-teal);position:relative;flex:none;display:inline-block;vertical-align:middle}
.tog.off{background:var(--mrx-border)}
.tog::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.off::after{right:auto;left:2px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--mrx-mint);color:var(--mrx-primary-dark);border:1px solid var(--mrx-teal)}
.daychip.off{background:var(--mrx-offwhite);color:var(--mrx-slate-gray);border-color:var(--mrx-border);font-weight:500;text-decoration:line-through}
.usechips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.usechip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e7f0ff;color:#2451b3;border:1px solid #c7dbff}
.usechip.ls{background:#e6f7f2;color:#0a7d5f;border-color:#9fe3cf}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="rx">N</span> Nume&nbsp;Health <small id="orgid">powered by Workshift</small></div>
    <div class="appswitch" id="appswitch"></div>
    <div class="spacer"></div>
    <label class="toolbtn devtoggle"><input type="checkbox" id="devToggle"> Dev detail</label>
    <button class="toolbtn" id="btnWf">⚙ Rx Lifecycle Workflow</button>
    <button class="toolbtn" id="btnInsp">◧ Config Inspector</button>
  </div>
  <div class="body" id="body">
    <div class="rail" id="rail"></div>
    <div class="main" id="main"></div>
    <div class="inspector" id="inspector" style="display:none"></div>
  </div>
</div>

<script>
/* ============================================================================
   WORKSHIFT ORG CONFIG  —  this object IS the build spec.
   Every screen below is rendered from it; nothing is hardcoded per role.
   Maps 1:1 onto real Workshift admin.v1 objects:
     ResourceType · Attribute(AttributeDataType) · Relationship ·
     PermissionGroup · ResourceView · App · Workflow(Node)
   Attribute .src = the PioneerRx API field it syncs from (integration map).
============================================================================ */
const ORG = {id:'org_numi', name:'Nume Health'};

// AttributeDataType (admin.v1) — the real enum
const DT = {ASSOCIATION:'ASSOCIATION',DATETIME:'DATETIME',EMAIL:'EMAIL',NUMBER:'NUMBER',
  PHONE:'PHONE',SELECT:'SELECT',STATUS:'STATUS',STRING:'STRING',TEXTBOX:'TEXTBOX',PASSWORD:'PASSWORD'};

// sensitivity classes drive masking + the HIPAA lens
// idn=identifier PHI, cln=clinical PHI, fin=financial, con=contact, sys=system, ops=operational
const RESOURCE_TYPES = {
  patient:{key:'patient',name:'Patient',plural:'Patients',icon:'👤',
    attrs:[
      {key:'fullName',name:'Full name',dt:DT.STRING,sens:'idn',src:'GetPatient.firstName+lastName'},
      {key:'personID',name:'Person ID',dt:DT.STRING,sens:'sys',src:'GetPatient.personID'},
      {key:'dob',name:'Date of birth',dt:DT.DATETIME,sens:'idn',src:'GetPatient.dateOfBirth'},
      {key:'ssn',name:'SSN',dt:DT.STRING,sens:'idn',src:'GetPatient.ssn'},
      {key:'medicareId',name:'Medicare ID',dt:DT.STRING,sens:'idn',src:'GetPatient.medicareBeneficiaryID'},
      {key:'phone',name:'Mobile phone',dt:DT.PHONE,sens:'con',src:'GetPatientPhone'},
      {key:'email',name:'Email',dt:DT.EMAIL,sens:'con',src:'GetPatient.email'},
      {key:'address',name:'Address',dt:DT.STRING,sens:'con',src:'GetPatientAddress'},
      {key:'status',name:'Patient status',dt:DT.STATUS,sens:'ops',src:'GetPatient.status'},
    ]},
  prescription:{key:'prescription',name:'Prescription',plural:'Prescriptions',icon:'💊',
    attrs:[
      {key:'rxNumber',name:'Rx number',dt:DT.STRING,sens:'sys',src:'RxEvent.RxNumber'},
      {key:'medicationPrescribed',name:'Medication prescribed',dt:DT.STRING,sens:'cln',src:'RxEvent.MedicationPrescribed'},
      {key:'medicationDispensed',name:'Medication dispensed',dt:DT.STRING,sens:'cln',src:'RxEvent.MedicationDispensed'},
      {key:'rxStatus',name:'Rx status',dt:DT.STATUS,sens:'ops',src:'RxEvent.CurrentRxStatusText'},
      {key:'transactionStatus',name:'Transaction status',dt:DT.STATUS,sens:'ops',src:'RxEvent.CurrentRxTransactionStatusText'},
      {key:'daysSupply',name:'Days supply',dt:DT.NUMBER,sens:'cln',src:'RxEvent.DaysSupply'},
      {key:'refillNumber',name:'Refill #',dt:DT.NUMBER,sens:'ops',src:'RxEvent.RefillNumber'},
      {key:'dawCode',name:'DAW code',dt:DT.SELECT,sens:'cln',src:'RxEvent.DawCodeText'},
      {key:'scriptType',name:'Script type',dt:DT.SELECT,sens:'ops',src:'RxEvent.ScriptType'},
      {key:'expirationDate',name:'Expiration',dt:DT.DATETIME,sens:'ops',src:'RxEvent.ExpirationDate'},
    ]},
  appointment:{key:'appointment',name:'Appointment',plural:'Appointments',icon:'📅',
    attrs:[
      {key:'dateTime',name:'Date & time',dt:DT.DATETIME,sens:'ops',src:'Workshift scheduling'},
      {key:'patientName',name:'Patient',dt:DT.STRING,sens:'idn',src:'GetPatient (linked record)'},
      {key:'apptType',name:'Type',dt:DT.SELECT,sens:'ops',src:'Workshift scheduling (Initial / Follow-up / Ad hoc)'},
      {key:'channel',name:'Channel',dt:DT.SELECT,sens:'ops',src:'Workshift scheduling (Video / Phone)'},
      {key:'apptStatus',name:'Status',dt:DT.STATUS,sens:'ops',src:'Workshift scheduling'},
      {key:'providerName',name:'Provider',dt:DT.STRING,sens:'ops',src:'Workshift provider directory'},
      {key:'reason',name:'Reason',dt:DT.STRING,sens:'cln',src:'Workshift scheduling'},
      {key:'intakeRef',name:'Intake',dt:DT.STRING,sens:'sys',src:'link → marketing questionnaire'},
    ]},
  intake:{key:'intake',name:'Intake questionnaire',plural:'Intake questionnaires',icon:'📋',
    attrs:[
      {key:'submitted',name:'Submitted',dt:DT.DATETIME,sens:'ops',src:'nume-health.com assessment form'},
      {key:'state',name:'State',dt:DT.SELECT,sens:'ops',src:'assessment: state eligibility'},
      {key:'primaryGoal',name:'Primary goal',dt:DT.STRING,sens:'cln',src:'assessment: goal'},
      {key:'healthHistory',name:'Health history flags',dt:DT.STRING,sens:'cln',src:'assessment: history checklist'},
      {key:'currentMeds',name:'Current medications',dt:DT.STRING,sens:'cln',src:'assessment: medications'},
      {key:'glp1History',name:'GLP-1 history',dt:DT.SELECT,sens:'cln',src:'assessment: prior GLP-1 use'},
      {key:'payPreference',name:'Payment preference',dt:DT.SELECT,sens:'ops',src:'assessment: pay preference'},
      {key:'smsOptIn',name:'SMS opt-in',dt:DT.SELECT,sens:'ops',src:'assessment: SMS consent checkbox'},
      {key:'sourceCampaign',name:'Source campaign',dt:DT.STRING,sens:'ops',src:'Workshift attribution (de-identified)'},
    ]},
  allergy:{key:'allergy',name:'Allergy',plural:'Allergies',icon:'⚠️',
    attrs:[
      {key:'substance',name:'Substance',dt:DT.STRING,sens:'cln',src:'GetPatientAllergy.substance'},
      {key:'reaction',name:'Reaction',dt:DT.STRING,sens:'cln',src:'GetPatientAllergy.reaction'},
      {key:'severity',name:'Severity',dt:DT.SELECT,sens:'cln',src:'GetPatientAllergy.severity'},
    ]},
  condition:{key:'condition',name:'Condition',plural:'Conditions',icon:'🩺',
    attrs:[
      {key:'name',name:'Condition',dt:DT.STRING,sens:'cln',src:'GetPatientCondition.name'},
      {key:'icd10',name:'ICD-10',dt:DT.STRING,sens:'cln',src:'GetPatientCondition.icd10'},
      {key:'onsetDate',name:'Onset',dt:DT.DATETIME,sens:'cln',src:'GetPatientCondition.onsetDate'},
    ]},
  payMethod:{key:'payMethod',name:'Payment method',plural:'Payment methods',icon:'💳',
    attrs:[
      {key:'cardBrand',name:'Card brand',dt:DT.SELECT,sens:'fin',src:'GetPatientAutoPayCreditCard.brand'},
      {key:'panToken',name:'PAN (tokenized)',dt:DT.STRING,sens:'fin',src:'processor token — PAN never stored'},
      {key:'last4',name:'Last 4',dt:DT.STRING,sens:'fin',src:'GetPatientAutoPayCreditCard.last4'},
      {key:'expiry',name:'Expiry',dt:DT.STRING,sens:'fin',src:'GetPatientAutoPayCreditCard.expiry'},
    ]},
  claim:{key:'claim',name:'Claim',plural:'Claims',icon:'🧾',
    attrs:[
      {key:'ndc',name:'NDC',dt:DT.STRING,sens:'ops',src:'RxEvent.NDC'},
      {key:'daw',name:'DAW',dt:DT.SELECT,sens:'ops',src:'RxEvent.DawCodeText'},
      {key:'billed',name:'Billed',dt:DT.NUMBER,sens:'fin',src:'AR.billedAmount'},
      {key:'paid',name:'Paid',dt:DT.NUMBER,sens:'fin',src:'AR.paidAmount'},
      {key:'arBalance',name:'A/R balance',dt:DT.NUMBER,sens:'fin',src:'GetPatientAccountsReceivable.balance'},
    ]},
  consentProfile:{key:'consentProfile',name:'Consent profile',plural:'Consent profiles',icon:'✅',
    attrs:[
      {key:'contactRef',name:'Contact ref',dt:DT.STRING,sens:'sys',src:'Workshift contact_id (de-identified)'},
      {key:'segment',name:'Segment',dt:DT.SELECT,sens:'ops',src:'Workshift segment (no dx / no drug)'},
      {key:'smsMarketingOptIn',name:'SMS marketing opt-in',dt:DT.SELECT,sens:'ops',src:'Workshift consent flag'},
      {key:'emailMarketingOptIn',name:'Email marketing opt-in',dt:DT.SELECT,sens:'ops',src:'Workshift consent flag'},
      {key:'lastConsentAt',name:'Last consent',dt:DT.DATETIME,sens:'ops',src:'Workshift consent event'},
    ]},
  message:{key:'message',name:'Message',plural:'Messages',icon:'💬',
    attrs:[
      {key:'channel',name:'Channel',dt:DT.SELECT,sens:'ops',src:'Workshift outbound'},
      {key:'template',name:'Template',dt:DT.STRING,sens:'ops',src:'Workshift template'},
      {key:'body',name:'Body',dt:DT.TEXTBOX,sens:'ops',src:'Workshift render'},
      {key:'status',name:'Delivery',dt:DT.STATUS,sens:'ops',src:'Twilio callback'},
      {key:'sentAt',name:'Sent',dt:DT.DATETIME,sens:'ops',src:'Workshift'},
    ]},
};

// Relationships (admin.v1 Relationship, ASSOCIATION_TYPE_MANY/ONE)
const RELATIONSHIPS = [
  {from:'patient',to:'appointment',assoc:'MANY'},
  {from:'appointment',to:'intake',assoc:'ONE'},
  {from:'patient',to:'prescription',assoc:'MANY'},
  {from:'patient',to:'allergy',assoc:'MANY'},
  {from:'patient',to:'condition',assoc:'MANY'},
  {from:'patient',to:'payMethod',assoc:'MANY'},
  {from:'patient',to:'claim',assoc:'MANY'},
  {from:'patient',to:'message',assoc:'MANY'},
  {from:'prescription',to:'claim',assoc:'ONE'},
];

/* view: what a role sees of a resource type.
   show:[keys] visible · mask:{key:'ssn|pan'} shown obfuscated · (anything not listed = hidden) */

const state = {appId:'app_staff', role:'provider', rtype:'appointment', detailId:null, insp:false, wf:false};

const el = s=>document.querySelector(s);
const RT = k=>RESOURCE_TYPES[k];
const cur = ()=>ROLES[state.role];
const app = ()=>APPS.find(a=>a.app_id===state.appId);
const esc = s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function permittedTypes(role){ return role.pg.filter(k=>role.views[k]); }
function fmt(v){ if(typeof v==='number') return (v%1?'$'+v.toFixed(2):(v>=100?'$'+v.toFixed(2):v)); return v; }

// apply a role's view to one attribute → {visible, value, masked}
function viewCell(role, rtypeKey, attr, data){
  const view = role.views[rtypeKey]; if(!view) return {visible:false};
  if(!view.show.includes(attr.key)) return {visible:false};
  const maskType = (view.mask||{})[attr.key];
  let value = data[attr.key];
  if(maskType==='ssn') value = '•••-••-'+String(data[attr.key]||'').slice(-4);
  if(maskType==='pan') value = 'tokenized · '+String(data[attr.key]||'');
  return {visible:true, value, masked:!!maskType, maskType};
}

/* ---------- MAIN: list + detail ---------- */
function renderMain(){
  const role=cur(), rtypeKey=state.rtype;
  if(rtypeKey==='_prefs' && state.role==='provider'){ el('#main').innerHTML=renderPrefs(); return; }
  const rt=RT(rtypeKey);
  if(!rt || !role.views[rtypeKey]){ // safety: pick first permitted
    state.rtype=permittedTypes(role)[0]; return renderAll();
  }
  const scoped = scopedResources(rtypeKey);
  let h = `<div class="crumbs"><a data-nav="list">${rt.plural}</a>${state.detailId?` <span>›</span> <span>${detailTitle(rtypeKey,state.detailId)}</span>`:''}</div>`;
  h += `<div class="pagehead"><div>
      <h1>${rt.icon} ${state.detailId?detailTitle(rtypeKey,state.detailId):rt.plural}</h1>
      <div class="sub">${role.icon} ${role.name} view<span class="devbit"> · ResourceView <code class="k">view_${rtypeKey}_${state.role}</code></span></div>
    </div><div class="lawful"><b>Lawful basis:</b> ${role.lawful}</div></div>`;

  if(state.role==='marketing'){
    h += `<div class="notice" style="margin-bottom:14px"><b>Minimum necessary — enforced by config, not convention.</b> Marketing's PermissionGroup contains <span class="src">[consentProfile]</span> only. There is no path from this app to a patient, drug, or diagnosis. The rows below are de-identified consent records.</div>`;
  }

  if(!state.detailId){
    h += renderList(rtypeKey, scoped, role);
  }else{
    if(rtypeKey==='appointment' && app().participant_type==='staff'){
      h += `<div class="callbar"><button class="btn-call" data-call="${state.detailId}">▶&nbsp; Start call</button></div>`;
    }
    h += renderDetail(rtypeKey, state.detailId, role);
  }
  el('#main').innerHTML=h;
}

function scopedResources(rtypeKey){
  let rows = RESOURCES[rtypeKey]||[];
  // patient app = row-level self scope
  if(app().participant_type==='patient'){
    rows = rows.filter(r=> (r.patient===PT)||(r.id===PT)||(r.contact===PT));
  }
  return rows;
}
function detailTitle(rtypeKey,id){
  const r=(RESOURCES[rtypeKey]||[]).find(x=>x.id===id); if(!r) return id;
  const d=r.data;
  return d.fullName||d.rxNumber||d.reason||d.primaryGoal||d.substance||d.name||d.cardBrand||d.ndc||d.template||d.contactRef||id;
}

function renderList(rtypeKey, rows, role){
  const rt=RT(rtypeKey);
  const cols = rt.attrs.filter(a=>role.views[rtypeKey].show.includes(a.key)).slice(0,5);
  let h=`<div class="card"><table><thead><tr>`;
  h += cols.map(a=>`<th>${a.name}</th>`).join('') + `<th></th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="${cols.length+1}" style="color:var(--mrx-slate-gray)">No ${rt.plural.toLowerCase()} in scope.</td></tr>`;
  rows.forEach(r=>{
    h+=`<tr class="rowlink" data-open="${r.id}">`;
    cols.forEach(a=>{
      const c=viewCell(role,rtypeKey,a,r.data);
      h+=`<td>${renderVal(a,c)}</td>`;
    });
    h+=`<td style="text-align:right;color:var(--mrx-blue)">Open ›</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function renderVal(attr,c){
  if(!c.visible) return `<span class="locked">—</span>`;
  if(c.masked) return `<span class="maskvalue">${esc(c.value)}</span>`;
  if(attr.dt===DT.STATUS){
    const cls = /pick|ready|deliver|complete|passed|active/i.test(c.value)?'ok':(/wait|progress|review|data/i.test(c.value)?'txn':'status');
    return `<span class="pill ${cls}">${esc(c.value)}</span>`;
  }
  return esc(fmt(c.value));
}

function renderDetail(rtypeKey,id,role){
  const rt=RT(rtypeKey);
  const r=(RESOURCES[rtypeKey]||[]).find(x=>x.id===id);
  if(!r) return `<div class="notice">Not found.</div>`;
  let h=`<div class="card"><div class="sectitle">${rt.icon} Fields <span class="tag">resource_type: ${rtypeKey}</span></div><div class="fieldgrid">`;
  rt.attrs.forEach(a=>{
    const c=viewCell(role,rtypeKey,a,r.data);
    if(!c.visible) return; // hidden by view = not rendered at all
    h+=`<div class="field"><div class="lbl">${esc(a.name)} <span class="badge dt">${a.dt}</span>${c.masked?`<span class="badge masked">masked</span>`:(a.sens==='cln'||a.sens==='idn'?`<span class="badge phi">phi</span>`:'')}</div>
        <div class="val ${a.dt===DT.STATUS?'':'mono'}">${a.dt===DT.STATUS?renderVal(a,c):esc(fmt(c.value))}</div>
        <div class="src">← ${esc(a.src)}</div></div>`;
  });
  h+=`</div></div>`;

  // related resources via relationships (respecting permission group)
  const rels = RELATIONSHIPS.filter(x=>x.from===rtypeKey && role.views[x.to]);
  rels.forEach(rel=>{
    const kids=(RESOURCES[rel.to]||[]).filter(k=>k.patient===id||k.rx===id);
    if(!kids.length) return;
    h+=`<div class="card" style="margin-top:16px"><div class="sectitle">${RT(rel.to).icon} ${RT(rel.to).plural}
        <span class="tag">Relationship · ASSOCIATION_TYPE_${rel.assoc}</span></div>`;
    h+=renderList(rel.to,kids,role).replace('<div class="card">','<div>').replace(/<\/div>$/,'</div>');
    h+=`</div>`;
  });
  return h;
}

  if(!state.insp){insp.style.display='none';return;}
  insp.style.display='block';
  const role=cur(), rtypeKey=state.rtype, rt=RT(rtypeKey), view=role.views[rtypeKey];
  let h=`<h3>Config Inspector</h3><p class="lead">The exact Workshift objects behind this screen — build them in the admin UI or via the <code style="color:#8fd0a3">mcp</code> tools / <code style="color:#8fd0a3">Save*</code> RPCs.</p>`;

  h+=`<div class="obj"><div class="rpc">AdminService.SaveResourceType</div>
    <div class="row"><span class="kk">key</span><span class="vv">${rt.key}</span></div>
    <div class="row"><span class="kk">plural</span><span class="vv">${rt.plural}</span></div>
    <div class="row"><span class="kk">icon</span><span class="vv">${rt.icon}</span></div></div>`;

  h+=`<div class="obj"><div class="rpc">AdminService.SaveAttribute × ${rt.attrs.length}</div>`;
  rt.attrs.forEach(a=>{
    const vis = view.show.includes(a.key) ? ((view.mask||{})[a.key]?'m':'y') : 'n';
    const mark = vis==='y'?'<span class="vis-y">● shown</span>':vis==='m'?'<span class="vis-m">● masked</span>':'<span class="vis-n">○ hidden</span>';
    h+=`<div class="attrline"><span class="an">${a.key}</span><span>${mark}</span>
        <span class="as">data_type: ATTRIBUTE_DATA_TYPE_${a.dt} · ← ${a.src}</span></div>`;
  });
  h+=`</div>`;

  h+=`<div class="obj"><div class="rpc">AdminService.SavePermissionGroup</div>
    <div class="row"><span class="kk">name</span><span class="vv">${role.name}</span></div>
    <div class="row"><span class="kk">role_id</span><span class="vv">${role.role_id}</span></div>
    <div class="row"><span class="kk">resource_type_ids</span><span class="vv">[${role.pg.join(', ')}]</span></div></div>`;

  h+=`<div class="obj"><div class="rpc">AdminService.SaveResourceView</div>
    <div class="row"><span class="kk">name</span><span class="vv">view_${rtypeKey}_${state.role}</span></div>
    <div class="row"><span class="kk">resource_type_id</span><span class="vv">${rtypeKey}</span></div>
    <div class="row"><span class="kk">show</span><span class="vv">[${view.show.join(', ')}]</span></div>
    ${Object.keys(view.mask||{}).length?`<div class="row"><span class="kk">mask</span><span class="vv">${JSON.stringify(view.mask)}</span></div>`:''}
    <div class="row"><span class="kk">rights</span><span class="vv">${role.rights.join(', ')}</span></div></div>`;

  h+=`<div class="obj"><div class="rpc">UserService.User (org-scoped)</div>
    <div class="row"><span class="kk">organization_id</span><span class="vv">${ORG.id}</span></div>
    <div class="row"><span class="kk">role_id</span><span class="vv">${role.role_id}</span></div>
    <div class="row"><span class="kk">rights[]</span><span class="vv">${role.rights.length}</span></div></div>`;
  insp.innerHTML=h;
}

/* ---------- WORKFLOW OVERLAY ---------- */
function renderWorkflow(){
  const main=el('#main');
  el('#body').classList.remove('insp');
  let h=`<div class="crumbs"><a data-nav="list">← Back to portal</a></div>
    <div class="pagehead"><div><h1>⚙ ${WORKFLOW.name}</h1>
      <div class="sub">Rx lifecycle walkthrough<span class="devbit"> · WorkflowService · type <code class="k">${WORKFLOW.type}</code> · resource_type <code class="k">${WORKFLOW.resource_type_id}</code></span></div></div>
      <div class="lawful"><b>One Rx, every role.</b> RX-208841 travels the org — each hop is a real permission + a real node.</div></div>`;

  h+=`<div class="card" style="padding:14px 16px"><div class="sectitle" style="padding:0 0 4px">Workflow graph <span class="tag">workflow.v1 Node</span></div><div class="graph">`;
  WORKFLOW.graph.forEach((n,i)=>{
    h+=`<div class="node"><div class="nt">${n.nt}</div><div class="nn">${n.nn}</div><small>${n.sub}</small></div>`;
    if(i<WORKFLOW.graph.length-1) h+=`<div class="arrow">→</div>`;
  });
  h+=`</div><div class="notice"><b>Finding:</b> Workshift's <code class="src">NodeType</code> enum has <code class="src">EMAIL</code> and <code class="src">WEBHOOK</code> but <b>no SMS node yet</b>. The refill text ships today as a <code class="src">WEBHOOK</code> → Twilio. Adding <code class="src">NODE_TYPE_SMS</code> is the one backend change this portal actually needs.</div></div>`;

  h+=`<div class="card" style="margin-top:16px;padding:6px 16px 16px"><div class="sectitle" style="padding:12px 0 0">Execution timeline <span class="tag">workflow.v1 Execution</span></div><div class="steps">`;
  WORKFLOW.steps.forEach((s,i)=>{
    const stName=s.exec.replace('EXECUTION_STATUS_','');
    h+=`<div class="step"><div class="who">${s.role}<small>lawful: ${s.lawful}</small>
        <div class="exec">Execution <span class="st-${stName}">● ${stName}</span></div></div>
        <div><div class="mut">${i+1}. ${s.mut}</div>`;
    if(s.msg){
      h+=`<div class="msg"><div class="ch">${s.node} · ${s.msg.ch}</div>${esc(s.msg.body)}</div>`;
    }else{
      h+=`<div class="src" style="margin-top:6px">node: ${s.node} · no outbound message</div>`;
    }
    h+=`</div></div>`;
  });
  h+=`</div></div>`;
  main.innerHTML=h;
}

/* ---------- CALL CONSOLE (dummy telehealth window) ---------- */
function openCallConsole(apptId){
  const ap = (RESOURCES.appointment||[]).find(a=>a.id===apptId); if(!ap) return;
  const pt = (RESOURCES.patient||[]).find(p=>p.id===ap.patient);
  const ik = (RESOURCES.intake||[]).find(i=>i.patient===apptId);
  const als = (RESOURCES.allergy||[]).filter(a=>a.patient===ap.patient);
  const cns = (RESOURCES.condition||[]).filter(c=>c.patient===ap.patient);
  const rxs = (RESOURCES.prescription||[]).filter(r=>r.patient===ap.patient);
  const initials = (ap.data.patientName||'?').split(' ').map(w=>w[0]).join('');
  const fld = (l,v)=>`<div style="margin-bottom:9px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#7A8794;font-weight:600">${l}</div><div style="font-size:13.5px;color:#2E3E50">${v??'—'}</div></div>`;

  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Nume Call — ${ap.data.patientName}</title></head>
  <body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#F7FAFC;height:100vh;display:flex;flex-direction:column">
    <div style="background:#101D31;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px">

      <b>Nume Telehealth</b><span style="opacity:.7">· ${ap.data.apptType} · ${ap.data.patientName}</span>
      <span id="timer" style="margin-left:auto;font-family:monospace;font-size:14px;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:6px">00:00</span>
      <button onclick="alert('Muted (demo)')" style="background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer">🎙 Mute</button>
      <button onclick="alert('Camera toggled (demo)')" style="background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer">🎥 Video</button>
      <button onclick="window.close()" style="background:#e5484d;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer">⏻ End call</button>
    </div>
    <div style="background:#0B1B2B;color:#9db4c8;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px">
      <span style="width:52px;height:52px;border-radius:50%;background:#12C8B8;color:#0B1B2B;display:grid;place-items:center;font-weight:800;font-size:19px">${initials}</span>
      <span>Connecting secure video… <b style="color:#fff">(demo console — no real call)</b></span>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:14px;padding:14px;min-height:0">
      ${card('👤 Patient information',
        fld('Name', ap.data.patientName)+fld('Date of birth', pt?.data.dob)+fld('Phone', pt?.data.phone)+fld('Address', pt?.data.address)
        +fld('Allergies', als.length?als.map(a=>`<span style="background:#fde8ea;color:#a12633;border:1px solid #f5c2c8;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;margin-right:5px">${a.data.substance} — ${a.data.severity}</span>`).join(''):'None recorded')
        +fld('Conditions', cns.length?cns.map(c=>c.data.name).join('; '):'None recorded')
        +fld('Active prescriptions', rxs.length?rxs.map(r=>`${r.data.rxNumber} · ${r.data.medicationPrescribed} (${r.data.rxStatus})`).join('<br>'):'None'))}
      ${card('📋 Intake questionnaire <span style="font-weight:500;color:#7A8794">(from marketing funnel — consent on file)</span>',
        ik?(fld('Submitted', ik.data.submitted)+fld('State', ik.data.state)+fld('Primary goal', ik.data.primaryGoal)+fld('Health history flags', ik.data.healthHistory)+fld('Current medications', ik.data.currentMeds)+fld('GLP-1 history', ik.data.glp1History)+fld('Payment preference', ik.data.payPreference)+fld('Source campaign', ik.data.sourceCampaign)):'No intake on file')}

            <div>Pregnant, planning pregnancy, or breastfeeding? &nbsp;${yn('q3')}</div>
            <div>Active gallbladder disease? &nbsp;${yn('q4')}</div>
            <div>Current GI symptoms &nbsp;<select><option>None</option><option>Mild</option><option>Moderate</option><option>Severe</option></select></div>

        ${card('📝 Clinical notes',
          `<textarea placeholder="Encounter notes…" style="width:100%;height:96px;border:1px solid #E2E8F0;border-radius:8px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box"></textarea>
           <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">

           </div>`)}
      </div>
    </div>
    <script>var s=0;setInterval(function(){s++;var m=String(Math.floor(s/60)).padStart(2,'0');var x=String(s%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+x;},1000);<\/script>
  </body></html>`;
  const w = window.open('','numiCallConsole','width=1320,height=900');
  if(!w){ alert('Popup blocked — allow popups for this page to open the call console.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---------- ORCHESTRATION ---------- */
function renderAll(){
  el('#body').classList.toggle('insp', state.insp && !state.wf);
  el('#btnInsp').classList.toggle('on', state.insp);
  el('#btnWf').classList.toggle('on', state.wf);
  renderAppSwitch();
  renderRail();
  if(state.wf){ renderWorkflow(); el('#inspector').style.display='none'; }
  else { renderMain(); renderInspector(); }
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-call]');
  if(c){ openCallConsole(c.dataset.call); return; }
  const t=e.target.closest('[data-app],[data-role],[data-rtype],[data-open],[data-nav]');
  if(t){
    if(t.dataset.app){ state.appId=t.dataset.app; const a=app(); state.role=a.roles[0]; state.rtype=permittedTypes(ROLES[state.role])[0]; state.detailId=null; state.wf=false; }
    else if(t.dataset.role){ state.role=t.dataset.role; state.rtype=permittedTypes(cur())[0]; state.detailId=null; }
    else if(t.dataset.rtype){ state.rtype=t.dataset.rtype; state.detailId=null; state.wf=false; }
    else if(t.dataset.open){ state.detailId=t.dataset.open; }
    else if(t.dataset.nav==='list'){ state.detailId=null; state.wf=false; }
    renderAll();
  }
});
el('#btnInsp').onclick=()=>{ state.insp=!state.insp; if(state.insp) state.wf=false; renderAll(); };
el('#devToggle').onchange=e=>{
  document.body.classList.toggle('showdev', e.target.checked);
  if(!e.target.checked && state.insp){ state.insp=false; renderAll(); }
};
el('#btnWf').onclick=()=>{ state.wf=!state.wf; if(state.wf) state.insp=false; renderAll(); };

renderAll();
</script>
